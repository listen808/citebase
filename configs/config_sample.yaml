# =============================================================================
# Citebase 完整配置模板 (Sample)
# =============================================================================
# 使用方式:
#   1. 复制此文件为 config.yaml:
#      cp config_sample.yaml config.yaml
#   2. 修改 config.yaml 中的实际值
#   3. 启动服务
#
# 配置搜索路径（优先级从高到低）:
#   <可执行文件目录>/configs/
#   <可执行文件父目录>/configs/
#   当前工作目录 ./configs/
#
# 环境变量覆盖（优先级高于 YAML 配置）:
#   仅以下键支持环境变量覆盖（实现见 internal/utils/config/config.go）:
#     CITEBASE_DB_DSN            覆盖 database.dsn
#     CITEBASE_ENCRYPT_KEY       覆盖 security.encrypt_key（32 字节 AES-GCM 密钥）
#     CITEBASE_REDIS_PASSWORD    覆盖 redis.password
#     CITEBASE_JWT_SECRET        JWT 签名密钥
#     CITEBASE_LOG_LEVEL         日志级别
#     CITEBASE_DATA_DIR          运行期数据目录
#     CITEBASE_SKIP_MIGRATE      跳过自动迁移（=true 时）
#     CITEBASE_SWAGGER           临时开启 Swagger（=1 时）
#     CITEBASE_TRUSTED_PROXIES   可信反向代理网段，逗号分隔（决定 c.ClientIP() 是否采信 XFF）
#     CITEBASE_JIEBA_DICT        中文分词词典目录（换机部署时词典不随 module cache 走）
#     CITEBASE_ENV               =production 时启用弱密钥 fail-fast 等运行期约束
#   改名前（2026-10-07 之前）的旧名 AIWIKI_* 同样能读，新旧同时存在时**新名优先、旧名兜底**，
#   机制见 internal/utils/envname。不一次性删掉旧名，是因为 viper 与 Getenv 对认不出的键
#   一律静默丢弃 —— 那会让现存部署全部失效而日志照说"加载成功"。
#   ⚠️ 唯一的例外是 docker-compose：它转发给容器的仍是旧名，
#      所以走容器的人在 .env 里请继续写 AIWIKI_ENCRYPT_KEY / AIWIKI_DB_DSN（直接跑二进制时两种都行）。
#     AI_ENABLED                  覆盖 ai.enabled（注意: 不是 AIWIKI_AI_ENABLED）
#     AI_PROVIDER                 覆盖 ai.provider
#     AI_BASE_URL                 覆盖 ai.base_url
#     AI_API_KEY                  覆盖 ai.api_key
#     AI_MODEL                    覆盖 ai.model
#   注意: server.port、ai.primary.api_key 等其余键不支持环境变量覆盖，
#         必须在 YAML 中配置。AIWIKI_<SECTION>_<KEY> 通用格式未实现。
# =============================================================================


# =============================================================================
# 服务器配置 (server)
# =============================================================================
server:
  # 监听地址
  # 类型: string  |  默认: "0.0.0.0"
  host: "0.0.0.0"

  # 监听端口
  # 类型: int  |  默认: 3001
  port: 3001

  # 运行模式
  #   debug   - 开发模式，Gin 输出详细访问日志
  #   release - 生产模式，关闭调试信息，优化性能
  # 类型: string  |  可选: debug | release  |  默认: debug
  mode: "debug"

  # 可信反向代理网段（CIDR 或 IP）。留空 = 不信任任何代理头，此时客户端 IP 只取真实连接地址。
  # 放在 Nginx/traefik 后面时**必须**配这一项，否则：
  #   - 限流按 IP 计数，而所有用户都算成代理那一个 IP —— 300 次/分钟是整站共享的，
  #     用户一多就常年 429（表现为"经常一直异常"）；
  #   - 访问日志与审计里记录的也是代理 IP，看不出真实来源。
  # 只在确实需要时填写，把不可信的网段写进来等于允许伪造 X-Forwarded-For，
  # 从而绕过 IP 白名单、限流与登录锁定。
  # 类型: []string  |  示例值: ["127.0.0.1", "10.0.0.0/8"]  |  默认: []
  trusted_proxies: []

  # 是否暴露 Swagger 接口文档（/swagger/index.html）。
  # 文档无需鉴权且会枚举全部接口与参数，只建议本地开发临时打开；
  # 也可用环境变量 AIWIKI_SWAGGER=1 临时开启，且 release 模式下始终关闭。
  # 类型: bool  |  默认: false
  swagger_open: false

  # CORS 允许的来源域名列表
  # 仅保留本地开发地址；生产环境请通过配置注入实际部署域名（如 https://kb.example.com）。
  # 注意: 同源请求（Origin == Host）由后端中间件自动放行，无需在此列出。
  # 切勿写入内网 IP 段，避免凭据/拓扑泄露到被跟踪的配置文件。
  # 类型: []string  |  默认: 见下方
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3001"


# =============================================================================
# 数据库配置 (database)
# =============================================================================
database:
  # 数据库驱动
  # 类型: string  |  可选: mysql  |  默认: mysql
  driver: "mysql"

  # 数据库连接字符串 (DSN)
  # 格式: username:password@tcp(host:port)/database?charset=utf8mb4&parseTime=True
  #
  # 注意:
  #   - 不指定 loc 参数，Go 驱动默认使用 UTC（避免 MySQL 时区表缺失导致连接失败）
  #   - 生产环境强烈建议通过环境变量 AIWIKI_DB_DSN 传入，避免明文密码写入配置文件
  #   - 若 MySQL 已导入时区表，可追加 &loc=Asia%2FShanghai 使用本地时区
  #
  # 类型: string  |  环境变量: AIWIKI_DB_DSN
  dsn: "root:YOUR_PASSWORD@tcp(127.0.0.1:3306)/citebase?charset=utf8mb4&parseTime=True"

  # 最大空闲连接数
  # 类型: int  |  默认: 10
  max_idle_conns: 10

  # 最大打开连接数
  # 类型: int  |  默认: 100
  max_open_conns: 100

  # 连接最大存活时间（秒）
  # 类型: int  |  默认: 3600 (1小时)
  conn_max_lifetime: 3600

  # 连接最大空闲时间（秒）
  # 类型: int  |  默认: 600 (10分钟)
  conn_max_idle_time: 600


# =============================================================================
# Redis 缓存配置 (redis)
# =============================================================================
# 启用后使用 Redis 作为缓存后端，提升查询性能并支持多实例共享缓存。
# 未启用或连接失败时自动回退到进程内缓存（MemoryCache），无需额外配置。
redis:
  # 是否启用 Redis 缓存
  # 类型: bool  |  默认: false
  enabled: false

  # Redis 服务器地址
  # 类型: string  |  默认: "127.0.0.1:6379"
  addr: "127.0.0.1:6379"

  # Redis 密码（无密码留空）
  # 类型: string  |  默认: ""  |  环境变量: AIWIKI_REDIS_PASSWORD
  password: ""

  # Redis 数据库编号 (0-15)
  # 类型: int  |  默认: 0
  db: 0

  # 连接池大小
  # 类型: int  |  默认: 10
  pool_size: 10

  # 最小空闲连接数（保持连接以应对突发请求）
  # 类型: int  |  默认: 5
  min_idle_conns: 5


# =============================================================================
# 协同编辑配置 (collab) — 由代码常量决定，YAML 不生效
# =============================================================================
# 实时协同编辑（Yjs CRDT over WebSocket /api/v1/collab/ws）的运行参数由代码常量控制:
#   单文档最大同时编辑人数、自动保存间隔、空闲卸载超时均见 internal/collab/ 包内常量。
# 本段 YAML 不被 internal/utils/config/config.go 读取，写在此处不会生效，仅作说明。
# 如需调整，请修改 internal/collab/ 相应常量并重新编译。


# =============================================================================
# 文件存储配置 (storage)
# =============================================================================
storage:
  # 静态文件根目录（前端构建产物）
  # 类型: string  |  默认: "./static"
  root_dir: "./static"

  # Bleve 全文搜索引擎索引存储目录
  # 类型: string  |  默认: "./data/index"
  index_dir: "./data/index"

  # 文档 Markdown 内容存储目录
  # 类型: string  |  默认: "./data/markdowns"
  document_dir: "./data/markdowns"

  # 图片上传存储目录
  # 类型: string  |  默认: "./data/images"
  image_dir: "./data/images"

  # 附件上传存储目录
  # 类型: string  |  默认: "./data/attachment"
  attachment_dir: "./data/attachment"

  # 文档正文来源：file=读 data/markdowns（默认）；db=读 aw_document_content 表
  # 类型: string  |  默认: "file"
  # 割接到 db 的步骤（详见 docs/citebase-割接方案与演练报告.md §11.1）：
  #   1. 前置：先跑迁移工具并校验通过 ——
  #      migrate_content -dsn=<本机DSN>（dry-run 看报告，missing_page>0 必须中止）
  #      → 加 -apply 导入 → -verify-only 全量回读 0 失败
  #   2. 改为 content_source: "db" 后重启
  #   3. 回滚：改回 "file" 重启（前提：磁盘 data/markdowns 未删）
  #   4. 注意：db 模式下本目录不再被读取，删除须等观察 1-2 周后按 P4 清理
  content_source: "file"

  # 附件二进制来源：file=读 data/attachment|images（默认）；db=读 aw_attachment_chunk 块表
  # 类型: string  |  默认: "file"
  # 割接到 db 的步骤（与 content_source 同一维护窗口，可独立切换）：
  #   1. 前置：migrate_attachment -dsn=<本机DSN>（dry-run 看孤儿清单与体积汇总）
  #      → -apply（自动补录孤儿图片、os.Stat 重算 size、4MB 分块、单附件一事务）
  #      → -verify-only 全量回读 0 失败
  #   2. 前置检查：SELECT path,COUNT(*) FROM aw_attachment GROUP BY path HAVING COUNT(*)>1;
  #      必须为 0 行，否则 path 唯一索引建不上（AutoMigrate 报错）
  #   3. 改为 attachment_source: "db" 后重启
  #   4. 回滚：改回 "file" 重启（前提：磁盘 data/attachment、data/images 未删）
  #   5. db 模式下备份不再打包 media 目录（SQL 已含块表完整副本）
  attachment_source: "file"


# =============================================================================
# AI 配置 (ai)
# =============================================================================
# 支持三层 Provider 架构:
#   primary   - 主力 LLM，用于知识问答、文档摘要、分析报告等核心任务
#   fast      - 轻量快速模型，用于实体提取、标签生成、标题生成等简单任务
#   reasoning - 深度推理模型，用于跨文档关系发现、知识缺口分析、矛盾检测等复杂任务
#
# 每层 Provider 未配置时自动回退到上一层（fast → primary, reasoning → primary）
#
# 支持的 Provider 类型（后端白名单，不可扩展）:
#   openai     - OpenAI 及兼容格式（也适用于 Moonshot/MiniMax/Yi/SiliconFlow 等 OpenAI 兼容厂商）
#   deepseek   - DeepSeek API (deepseek-chat, deepseek-reasoner)
#   qwen       - 通义千问 API (qwen-max, qwen-plus, qwen-turbo)
#   zhipu      - 智谱 GLM API (glm-4-plus, glm-4-air, glm-4-flash)
#   ernie      - 百度文心 API (ernie-4.5, ernie-speed)
#   gemini     - Google Gemini API (gemini-2.0-flash, gemini-2.5-pro)
#   ollama     - 本地 Ollama 部署 (llama4, qwen3, deepseek-r1, gemma3 等)
#   anthropic  - Anthropic 原生格式 (claude-sonnet-4, claude-3-7-sonnet, claude-3-5-haiku)
#
# 新兴厂商使用方法（走 openai 兼容格式，provider 填 openai，自定义 base_url）:
#   Moonshot (Kimi K2):    provider=openai, base_url=https://api.moonshot.cn/v1,         model=kimi-k2-0711-preview
#   MiniMax:               provider=openai, base_url=https://api.minimax.chat/v1,          model=MiniMax-Text-01
#   Yi (零一万物):          provider=openai, base_url=https://api.lingyiwanwu.com/v1,      model=yi-lightning
#   SiliconFlow (硅基流动): provider=openai, base_url=https://api.siliconflow.cn/v1,       model=Qwen/Qwen3-32B
#   Stepfun (阶跃星辰):     provider=openai, base_url=https://api.stepfun.com/v1,          model=step-2-16k
#
# 快速启动（环境变量一键配置）:
#   export AI_ENABLED=true
#   export AI_PROVIDER=openai
#   export AI_BASE_URL=https://api.openai.com/v1
#   export AI_API_KEY=sk-xxxxxxxx
#   export AI_MODEL=gpt-4.1
# =============================================================================
ai:
  # ---------------------------------------------------------------------------
  # 是否启用 AI 模块
  # 关闭后所有 AI 功能不可用，前端 AI 入口隐藏
  # 类型: bool  |  默认: false  |  环境变量: AIWIKI_AI_ENABLED
  # ---------------------------------------------------------------------------
  enabled: false

  # =========================================================================
  # 多 Provider 配置模式（推荐，优先级高于简化模式）
  # =========================================================================

  # ---------------------------------------------------------------------------
  # primary: 主力 LLM 配置
  # 用于知识问答、文档摘要、报告生成等核心任务
  # 推荐: GPT-4.1 (OpenAI 最新旗舰) / Claude 3.7 Sonnet / DeepSeek V3 / Qwen3-Max
  # ---------------------------------------------------------------------------
  primary:
    # Provider 类型
    # 类型: string  |  可选: openai | deepseek | qwen | zhipu | ernie | gemini | ollama | anthropic
    provider: "openai"

    # API 基础地址
    # OpenAI:     https://api.openai.com/v1
    # DeepSeek:   https://api.deepseek.com/v1
    # 通义千问:    https://dashscope.aliyuncs.com/compatible-mode/v1
    # 智谱:       https://open.bigmodel.cn/api/paas/v4
    # Anthropic:  https://api.anthropic.com
    # Gemini:     https://generativelanguage.googleapis.com/v1beta
    # Ollama:     http://localhost:11434/v1
    # Moonshot:   https://api.moonshot.cn/v1
    # SiliconFlow: https://api.siliconflow.cn/v1
    # 类型: string
    base_url: "https://api.openai.com/v1"

    # API 密钥
    # 类型: string  |  环境变量: AIWIKI_AI_PRIMARY_API_KEY
    api_key: "sk-YOUR_OPENAI_API_KEY_HERE"

    # 模型名称（2026 年最新推荐）
    # OpenAI:     gpt-4.1 (旗舰) / gpt-4.1-mini (性价比) / gpt-4o (旧版)
    # Anthropic:  claude-sonnet-4-20250514 / claude-3-7-sonnet-20250219
    # DeepSeek:   deepseek-chat (V3-0324) / deepseek-reasoner (R1)
    # 通义千问:    qwen3-max / qwen3-plus / qwen-plus / qwen-turbo
    # 智谱:       glm-4-plus / glm-z1-air
    # 文心:       ernie-4.5 / ernie-speed
    # Gemini:     gemini-2.5-pro / gemini-2.5-flash
    # Moonshot:   kimi-k2-0711-preview
    # 类型: string
    model: "gpt-4.1"

    # 最大输出 Token 数
    # 类型: int  |  默认: 4096
    max_tokens: 4096

    # 生成温度 (0.0-2.0)，越高越随机
    # 类型: float  |  默认: 0.7
    temperature: 0.7

  # ---------------------------------------------------------------------------
  # fast: 轻量快速模型配置
  # 用于实体提取、标签生成、标题生成等简单、高频任务
  # 推荐: gpt-4.1-mini / claude-3-5-haiku / deepseek-chat / qwen3-turbo
  # 未配置时回退到 primary
  # ---------------------------------------------------------------------------
  fast:
    provider: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: "sk-YOUR_OPENAI_API_KEY_HERE"
    model: "gpt-4.1-mini"         # 推荐使用轻量模型以降低成本
    max_tokens: 2048
    temperature: 0.3              # 简单任务建议低温度，保证输出稳定

  # ---------------------------------------------------------------------------
  # reasoning: 深度推理模型配置
  # 用于跨文档关系发现、知识缺口分析、矛盾检测等复杂推理任务
  # 推荐: o4-mini / o3 / claude-sonnet-4 / deepseek-reasoner / qwen3-max
  # 未配置时回退到 primary
  # ---------------------------------------------------------------------------
  reasoning:
    provider: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: "sk-YOUR_OPENAI_API_KEY_HERE"
    model: "o4-mini"                  # 推荐使用推理增强模型
    max_tokens: 8192
    temperature: 0.2              # 推理任务建议低温度

  # =========================================================================
  # Embedding 配置（向量检索必需）
  # 未配置时使用 primary 的 base_url 和 api_key
  # =========================================================================
  embedding:
    # Provider 类型
    # 类型: string  |  可选: openai | ollama | local
    provider: "openai"

    # API 基础地址
    # OpenAI:     https://api.openai.com/v1
    # Ollama:     http://localhost:11434  (注意: Ollama embedding 地址不带 /v1)
    # 类型: string
    base_url: "https://api.openai.com/v1"

    # API 密钥
    # 类型: string
    api_key: "sk-YOUR_OPENAI_API_KEY_HERE"

    # Embedding 模型名称
    # OpenAI:  text-embedding-3-small (性价比) / text-embedding-3-large (精度)
    # Ollama:  nomic-embed-text / bge-m3 / mxbai-embed-large
    # 智谱:    embedding-3
    # 类型: string
    model: "text-embedding-3-small"

  # =========================================================================
  # MCP (Model Context Protocol) 服务器配置
  # =========================================================================
  # 启用后可接入外部工具服务器（stdio/SSE/HTTP），扩展 Agent 能力。
  # 安全提示: stdio 类型的 server 可执行本地命令，仅在高可信环境启用。
  # 两种写法等价: mcp.servers 或顶层 mcp_servers（旧格式，兼容保留）。
  mcp:
    # 是否启用 MCP
    # 类型: bool  |  默认: false
    enabled: false
    # MCP 服务器列表
    servers: []
    # 示例:
    # servers:
    #   - name: "filesystem"
    #     transport: "stdio"        # stdio | sse | streamable_http
    #     command: "npx"
    #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/data"]
    #     env: {}
    #     endpoint: ""              # transport=sse/http 时填 URL

  # =========================================================================
  # 知识分析器配置 (analyzer) — 由数据库 aw_config 决定，YAML 不生效
  # =========================================================================
  # analyzer 的 batch_size / max_concurrent / rate_limit_rpm / doc_max_chars /
  # context_max_chars 实际由数据库 aw_config 表的 ai_analyzer_* 键控制
  # （见 internal/repository/db.go 种子值），通过管理后台 /系统设置 调整。
  # 本 YAML 段不被 config.AIConfig 读取，写在此处静默无效，仅作说明。
  # 如需在启动前调整，请修改 internal/repository/db.go 的种子值或部署后通过 API 修改。

  # =========================================================================
  # 向量检索与重排序配置
  # =========================================================================

  # 向量存储后端类型
  #   bolt   - 嵌入式 BoltDB + HNSW（零依赖，适合单机部署）
  #   chroma - Chroma 向量数据库（需独立部署）
  #   qdrant - Qdrant 向量数据库（需独立部署，性能最佳）
  # 类型: string  |  可选: bolt | chroma | qdrant  |  默认: bolt
  vector_store_type: "bolt"

  # 向量检索权重（与 keyword_weight 合计应为 1.0）
  # 类型: float  |  默认: 0.7
  vector_weight: 0.7

  # 关键词检索权重
  # 类型: float  |  默认: 0.3
  keyword_weight: 0.3

  # 检索返回 Top-K 结果数
  # 类型: int  |  默认: 20
  search_top_k: 20

  # 相似度阈值（低于此值的结果被过滤）
  # 类型: float  |  默认: 0.3
  similarity_threshold: 0.3

  # 是否启用重排序（提升检索精度，但增加延迟和成本）
  # 类型: bool  |  默认: false
  rerank_enabled: false

  # 重排序服务 API 地址（如 Cohere Rerank API）
  # 类型: string  |  默认: ""
  rerank_endpoint: ""

  # 重排序服务 API 密钥
  # 类型: string  |  默认: ""
  rerank_api_key: ""

  # Chroma 向量库连接地址
  # 类型: string  |  默认: "http://localhost:8000"
  chroma_endpoint: "http://localhost:8000"

  # Qdrant 向量库连接地址
  # 类型: string  |  默认: ""
  qdrant_endpoint: ""

  # Qdrant API 密钥（Qdrant Cloud 需要）
  # 类型: string  |  默认: ""
  qdrant_api_key: ""

  # RAG 问答单次最大上下文字符数
  # 检索到的文档片段总长度超过此值会被截断
  # 类型: int  |  默认: 6000
  max_context_chars: 6000

  # ---------------------------------------------------------------------------
  # 功能成熟度过滤 — 由 /ai/config/maturity 接口 ?min= 查询参数控制，YAML 不生效
  # ---------------------------------------------------------------------------
  # min_maturity 不被 config.AIConfig 读取，实际过滤由 /ai/config/maturity
  # 接口的 ?min= 查询参数决定（见 internal/api/ai/config.go）。
  # 如需调整默认成熟度，请通过管理 API 修改。

  # ---------------------------------------------------------------------------
  # Agent 工具能力边界（安全）
  # ---------------------------------------------------------------------------
  # 这四个工具的输入直接来自模型输出：开启后等价把服务器 shell / 文件读写 / 业务库查询
  # 交给「能发起对话的任何用户」，也可能被检索到的文档内容用 prompt 注入驱动。
  # 因此默认全部关闭；确需开启时请同时给出最小可用白名单，并优先在隔离环境验证。
  agent_tools:
    # 类型: bool | 默认: false
    enable_code_executor: false    # execute_code：Python/Node 执行
    enable_system_command: false   # execute_command：shell 命令（白名单外一律拒绝）
    enable_file_operation: false   # file_operation：服务器文件读写
    enable_database_query: false   # query_database：对业务库执行模型生成的 SQL

    # execute_command 允许的命令；为空时使用内置只读集合（ls/cat/grep/... 每段管道都会校验）
    allowed_commands: []
    # file_operation 允许读写的目录前缀；为空时该工具拒绝一切路径（fail-closed）
    allowed_dirs: []
    # api_call / fetch_web 允许出网的域名（精确或子域）；为空时仅禁止内网与云元数据地址
    allowed_domains: []
    # query_database 单次返回行数硬上限（模型给的 limit 只能更小）
    max_result_rows: 500
    # 命令/代码执行超时（秒，上限 60）
    timeout_seconds: 30

  # =========================================================================
  # Token 配额管理
  # 用于控制 API 调用成本
  # =========================================================================

  # 每日全局 Token 上限（0 = 不限制）
  # 类型: int  |  默认: 0
  daily_token_limit: 0

  # 每用户每日 Token 上限（0 = 不限制）
  # 类型: int  |  默认: 0
  per_user_token_limit: 0

  # =========================================================================
  # 分析与调度配置 — 由代码默认值/数据库决定，YAML 不生效
  # =========================================================================
  # 以下键不被 config.AIConfig 读取（见 internal/utils/config/config.go），
  # ai_init.go 构造 ai.AIConfig 时也不传递，实际值由 ai.BuildAIConfig 硬编码:
  #   ai_space_name      = "AI 知识库"（ai.go:852）
  #   system_user_id     = 1（ai.go:853）
  #   analyzer           = analyzer.DefaultAnalyzerConfig()（ai.go:851）
  # 定时分析 schedule/schedule_task_type/schedule_space_ids 同样未被 ai_init.go 传递，
  # 当前只要 ai.enabled=true 且 sched 非空就会回退到硬编码 "0 2 * * *" 每日全量分析。
  # Git 同步（git_sync_enabled/git_sync_interval）已随割接 P3 下线删除，配置键不再被读取。
  # 如需真正可配置，需修改 app/server/ai_init.go 传递这些字段（属后端修复）。
  # 如需禁用定时分析，临时方案是设置 ai.enabled=false 或修改 ai.go 的 cronScheduler 逻辑。

  # =========================================================================
  # 简化配置模式（兼容 v1 单 Provider）
  # =========================================================================
  # 仅指定以下字段时，自动构建为 primary/fast/reasoning 共用同一 Provider。
  # 同时配置 primary/fast/reasoning 和简化字段时，简化字段作为回退（fallback）。
  #
  # 使用方法: 取消下方注释并填入实际值，同时注释掉上方的 primary/fast/reasoning 块
  #
  # provider: "openai"
  # base_url: "https://api.openai.com/v1"
  # api_key: "sk-YOUR_OPENAI_API_KEY_HERE"
  # model: "gpt-4o"
  # max_tokens: 4096
  # temperature: 0.7
  # embedding_url: "https://api.openai.com/v1"
  # embedding_key: "sk-YOUR_OPENAI_API_KEY_HERE"
  # embedding_model: "text-embedding-3-small"


# =============================================================================
# Text2SQL 配置 (text2sql)
# =============================================================================
# Text2SQL 独立配置段，所有参数均有默认值，旧配置文件不配置时使用默认值。
text2sql:
  # ---------------------------------------------------------------------------
  # 生成策略
  # ---------------------------------------------------------------------------
  # 主生成循环重试次数
  # 类型: int  |  默认: 3
  max_retries: 3

  # 多候选生成数量
  # 类型: int  |  默认: 3
  num_candidates: 3

  # 是否启用多候选生成
  # 类型: bool  |  默认: true
  enable_multi_candidate: true

  # 是否并行生成候选（false=串行，true=并行）
  # 类型: bool  |  默认: true
  enable_parallel_candidate: true

  # 是否启用多跳推理（复杂查询拆解为子查询）
  # 类型: bool  |  默认: true
  enable_multi_hop: true

  # 多跳最大跳数
  # 类型: int  |  默认: 3
  multi_hop_max_hops: 3

  # 触发多跳的复杂度阈值（0-100，EstimateComplexity 评分 >= 此值时触发）
  # 类型: int  |  默认: 50
  multi_hop_complexity_threshold: 50

  # ---------------------------------------------------------------------------
  # 模型参数
  # ---------------------------------------------------------------------------
  # 生成温度（主生成循环）
  # 类型: float  |  默认: 0.1
  temperature_generation: 0.1

  # 多候选生成温度
  # 类型: float  |  默认: 0.3
  temperature_candidate: 0.3

  # 多跳推理温度
  # 类型: float  |  默认: 0.2
  temperature_multi_hop: 0.2

  # 单次生成最大 token
  # 类型: int  |  默认: 1000
  max_tokens: 1000

  # ---------------------------------------------------------------------------
  # Schema Linking
  # ---------------------------------------------------------------------------
  # 表级向量检索 TopK
  # 类型: int  |  默认: 20
  schema_top_k_tables: 20

  # 列级向量检索 TopK
  # 类型: int  |  默认: 40
  schema_top_k_columns: 40

  # Schema 上下文最大表数
  # 类型: int  |  默认: 15
  schema_max_tables: 15

  # Schema 上下文最大字符数
  # 类型: int  |  默认: 45000
  schema_max_chars: 45000

  # FK 发现置信度阈值（低于此值的外键推断被丢弃）
  # 类型: float  |  默认: 0.6
  fk_confidence_threshold: 0.6

  # ---------------------------------------------------------------------------
  # Few-shot 示例
  # ---------------------------------------------------------------------------
  # Few-shot 示例数量
  # 类型: int  |  默认: 3
  few_shot_count: 3

  # 示例 SQL 截断长度
  # 类型: int  |  默认: 500
  few_shot_sql_max_chars: 500

  # ---------------------------------------------------------------------------
  # 执行
  # ---------------------------------------------------------------------------
  # 执行结果最大行数
  # 类型: int  |  默认: 200
  execution_max_rows: 200

  # 执行超时秒数
  # 类型: int  |  默认: 15
  execution_timeout_sec: 15

  # 执行结果 Warning 行数阈值（超过触发警告）
  # 类型: int  |  默认: 10000
  execution_warning_rows: 10000

  # ---------------------------------------------------------------------------
  # 反馈循环
  # ---------------------------------------------------------------------------
  # 是否启用执行反馈循环（4 级反馈：OK/Warning/Error/Empty + LLM 修正）
  # 类型: bool  |  默认: true
  enable_execution_feedback_loop: true

  # 反馈修正最大重试次数
  # 类型: int  |  默认: 2
  feedback_max_retry: 2

  # ---------------------------------------------------------------------------
  # Trace 追踪
  # ---------------------------------------------------------------------------
  # 是否启用 Trace（持久化到 aw_ai_sql_trace 表）
  # 类型: bool  |  默认: true
  enable_trace: true

  # 是否记录中间步骤（schema_linking/llm_call/validate/execute 等）
  # 类型: bool  |  默认: true
  enable_trace_steps: true


# =============================================================================
# 搜索增强配置 (search)
# =============================================================================
search:
  # ---------------------------------------------------------------------------
  # 同义词扩展组
  # 用于 Bleve 全文搜索时自动扩展查询词，提高召回率。
  # 每个 words 组内的词被视为同义词，搜索任一词时会自动匹配组内所有词。
  #
  # 示例: 搜索 "文档" 时，也会匹配包含 "文件"、"记录"、"内容" 的文档
  # ---------------------------------------------------------------------------
  synonyms:
    - words: ["文档", "文件", "记录", "内容"]
    - words: ["搜索", "查找", "检索", "查询"]
    - words: ["创建", "新建", "添加", "新增"]
    - words: ["删除", "移除", "去掉", "清除"]
    - words: ["编辑", "修改", "更新", "调整"]
    - words: ["空间", "目录", "文件夹", "区域"]
    - words: ["用户", "成员", "人员", "使用者"]
    - words: ["设置", "配置", "偏好", "选项"]
    - words: ["管理", "维护", "处理", "控制"]
    - words: ["帮助", "支持", "协助", "辅助"]
    - words: ["指南", "教程", "手册", "指引"]
    - words: ["常见问题", "FAQ", "问答", "疑问"]


# =============================================================================
# OIDC / OAuth2 单点登录配置 (oidc) — 由数据库 aw_oidc_provider 表决定，YAML 不生效
# =============================================================================
# OIDC 提供方配置存储在数据库 aw_oidc_provider 表中，通过管理后台 UI 或 API 管理。
# 本段 YAML 不被 internal/utils/config/config.go 读取（Config 无 OIDC 字段），
# oidc.enabled: false 不能关闭 SSO 入口——登录页仍会列出 aw_oidc_provider 中 enabled=1 的提供方。
# 如需禁用某个提供方，请通过管理 API 将其 enabled 列设为 0。
#
# 管理 API:
#   POST   /api/v1/auth/oidc/admin/providers       创建 OIDC 提供方
#   GET    /api/v1/auth/oidc/admin/providers        列出所有提供方
#   PUT    /api/v1/auth/oidc/admin/providers/:id    更新提供方
#   DELETE /api/v1/auth/oidc/admin/providers/:id    删除提供方
#
# 登录流程:
#   1. 前端获取已启用的提供方: GET /api/v1/auth/oidc/providers
#   2. 用户点击 SSO 按钮，前端调用: GET /api/v1/auth/oidc/:id/login
#   3. 浏览器重定向到 IdP 进行认证
#   4. IdP 回调到前端 /auth/sso/callback，前端调用后端 API 交换 token
#   5. 后端返回 JWT，前端存储并跳转到主页
#
# 支持的提供方类型:
#   oidc      - 通用 OIDC 提供方（Keycloak、Auth0、Okta 等）
#   google    - Google OAuth2/OIDC
#   github    - GitHub OAuth2
#   azure     - Azure AD (Microsoft Entra ID)
#   keycloak  - Keycloak (本地部署)
#
# 示例: Keycloak OIDC 配置
#   通过管理 API 创建:
#   POST /api/v1/auth/oidc/admin/providers
#   {
#     "name": "keycloak",
#     "display_name": "Keycloak SSO",
#     "type": "keycloak",
#     "client_id": "citebase",
#     "client_secret": "your-client-secret",
#     "issuer_url": "https://keycloak.example.com/realms/your-realm",
#     "scopes": "openid,profile,email",
#     "auto_create": true,
#     "default_role": "viewer"
#   }


# =============================================================================
# 安全加固配置 (security)
# =============================================================================
# 静态字段加密密钥与 IP 白名单开关。生产环境必须配置 encrypt_key。
security:
  # 静态字段加密密钥（AES-GCM，32 字节，原始字符串或 hex 编码）
  # 优先级: 环境变量 AIWIKI_ENCRYPT_KEY > 此处 YAML > 内置派生密钥（仅开发用，不安全）
  # 生产环境强烈建议通过环境变量注入，且 release 模式下留空应拒绝启动。
  # 生成示例: openssl rand -hex 32
  # 类型: string  |  环境变量: AIWIKI_ENCRYPT_KEY
  encrypt_key: ""

  # IP 白名单（G115）
  # 启用后，仅 ip_whitelist 内的 IP/CIDR 可以访问（mode=allow）或被封锁（mode=deny）。
  # 留空 + enabled=false 表示不启用 IP 白名单（默认）。
  # 类型: bool  |  默认: false
  ip_whitelist_enabled: false

  # 允许/封锁的 IP 或 CIDR 列表
  # 类型: []string  |  默认: []
  ip_whitelist: []
  # 示例:
  # ip_whitelist:
  #   - "127.0.0.1"
  #   - "10.0.0.0/8"

  # 白名单模式
  #   allow - 仅放行列表内 IP（默认）
  #   deny  - 封锁列表内 IP，其余放行
  # 类型: string  |  可选: allow | deny  |  默认: allow
  ip_whitelist_mode: "allow"


