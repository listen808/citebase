      - 文档
  /api/v1/documents/:id/rollback:
    post:
      consumes:
      - application/json
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{version: int}'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: message
      summary: 回滚文档版本
      tags:
      - 文档
  /api/v1/documents/:id/stats:
    get:
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 文档访问统计
      tags:
      - 文档
  /api/v1/documents/:id/translations:
    get:
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 文档翻译版本列表
      tags:
      - 文档翻译
    post:
      consumes:
      - application/json
      parameters:
      - description: 原文档 ID
        in: path
        name: id
        required: true
        type: integer
      - description: '{lang, translated_document_id, translation_status}'
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
      summary: 创建文档翻译
      tags:
      - 文档翻译
  /api/v1/documents/:id/versions:
    get:
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
