        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: message
      summary: 彻底删除文档
      tags:
      - 文档
  /api/v1/documents/:id/restore:
    post:
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
