        in: path
        name: id
        required: true
        type: integer
      - description: 复制目标
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: message
      summary: 复制文档
      tags:
      - 文档
  /api/v1/documents/:id/diff:
    get:
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 起始版本号（0=当前内容）
        in: query
        name: from
        required: true
        type: integer
      - description: 目标版本号（0=当前内容）
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 版本差异对比
      tags:
      - 文档
  /api/v1/documents/:id/move:
    put:
      consumes:
      - application/json
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 移动目标
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
