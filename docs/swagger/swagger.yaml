basePath: /api/v1
definitions:
  ai.DetectIntentRequest:
    properties:
      question:
        type: string
    required:
    - question
    type: object
  ai.DetectIntentResponse:
    properties:
      confidence:
        type: number
      hints:
        items:
          type: string
        type: array
      intent:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
      message_detail:
        description: |-
          MessageDetail 是给界面看的具体原因（哪个字段没填对、哪个约束冲突），不是句子。
          为什么要把"句子"和"原因"分成两个字段：句子要翻译，原因通常不用（它是 gin binding 的
          字段名、或某个具体值）；混在一句话里拼字符串，英文界面就会拿到半英半中的句子。
          数据库/驱动原文**不许**进这个字段 —— 那是 internal/api/error_leak_test.go 拦的泄漏面。
        type: string
      message_key:
        description: |-
          MessageKey 是给前端的稳定文案键（契约见 messages.go）。
          omitempty：绝大多数响应没有用户文案（成功响应、纯数据），不带这个字段就是今天的样子。
        type: string
    type: object
  workspace.ApprovalHandleRequest:
    properties:
      comment:
        type: string
      decision:
        description: approve/reject
        enum:
        - approve
        - reject
        type: string
    required:
    - decision
    type: object
  workspace.ApprovalRequest:
    properties:
      approver:
        description: 指定审批人
        type: integer
      comment:
        type: string
      document_id:
        type: integer
    required:
    - approver
    - document_id
    type: object
  workspace.CreateTemplateRequest:
    properties:
      content:
        type: string
      description:
        type: string
      name:
        maxLength: 100
        type: string
      space_id:
        type: integer
    required:
    - name
    type: object
  workspace.CreateVersionTagRequest:
    properties:
      color:
        maxLength: 20
        type: string
      note:
        maxLength: 500
        type: string
      tag_name:
        maxLength: 100
        type: string
      version:
        type: integer
    required:
    - tag_name
    - version
    type: object
  workspace.DocumentVersionTagResponse:
    properties:
      color:
        type: string
      create_time:
        type: integer
      created_by:
        type: integer
      creator_name:
        type: string
      document_id:
        type: integer
      id:
        type: integer
      note:
        type: string
      tag_name:
        type: string
      version:
        type: integer
    type: object
host: localhost:3001
info:
  contact: {}
  description: |-
    Enterprise AI Knowledge Management Platform
    Wiki + RAG + Text-to-SQL all-in-one
  title: Citebase API
  version: 2.0.0
paths:
  /api/v1/ai/intent/detect:
    post:
      consumes:
      - application/json
      parameters:
      - description: 待识别的问题
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ai.DetectIntentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ai.DetectIntentResponse'
      summary: 识别用户输入意图
      tags:
      - AI
  /api/v1/ai/memory/{id}/confirm:
    post:
      parameters:
      - description: 记忆ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 确认一条记忆（使其进入召回）
      tags:
      - AI
  /api/v1/ai/memory/pending:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出待确认的记忆
      tags:
      - AI
  /api/v1/ai/wiki/export:
    get:
      parameters:
      - description: 空间ID
        in: query
        name: space_id
        required: true
        type: integer
      - description: zip（默认，打包全部）或 md（单页）
        in: query
        name: format
        type: string
      - description: format=md 时的页面 slug
        in: query
        name: slug
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Wiki 知识页导出（OKF/Markdown，zip 或单页）
      tags:
      - AI
  /api/v1/ai/wiki/pages/{slug}/contradictions:
    post:
      consumes:
      - application/json
      parameters:
      - description: 空间ID
        in: query
        name: space_id
        required: true
        type: integer
      - description: 页面 slug
        in: path
        name: slug
        required: true
        type: string
      - description: 'items: []string'
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Wiki 页面写入时矛盾标注
      tags:
      - AI
  /api/v1/ai/wiki/pages/{slug}/history:
    get:
      parameters:
      - description: 空间ID
        in: query
        name: space_id
        required: true
        type: integer
      - description: 页面 slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Wiki 页面版本历史
      tags:
      - AI
  /api/v1/ai/wiki/pages/{slug}/rollback:
    post:
      consumes:
      - application/json
      parameters:
      - description: 空间ID
        in: query
        name: space_id
        required: true
        type: integer
      - description: 页面 slug
        in: path
        name: slug
        required: true
        type: string
      - description: version
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Wiki 页面回滚到历史版本
      tags:
      - AI
  /api/v1/ai/wiki/propose-analysis:
    post:
      consumes:
      - application/json
      parameters:
      - description: space_id/title/question/answer
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Wiki 好答案回填（问答 → analysis 草稿页）
      tags:
      - AI
  /api/v1/auth-sso:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: SSO 配置列表
      tags:
      - 认证配置
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
      summary: 创建 SSO 配置
      tags:
      - 认证配置
  /api/v1/auth-sso/{id}:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 删除 SSO 配置
      tags:
      - 认证配置
    get:
      parameters:
      - description: SSO ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 获取 SSO 配置
      tags:
      - 认证配置
    put:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 更新 SSO 配置
      tags:
      - 认证配置
  /api/v1/auth-sso/{id}/default:
    put:
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 设为默认认证
      tags:
      - 认证配置
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录凭证
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 用户登录
      tags:
      - 认证
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: message
      summary: 用户登出
      tags:
      - 认证
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 获取当前用户信息
      tags:
      - 认证
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户资料（不允许修改 role_id）
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 更新当前用户资料
      tags:
      - 认证
  /api/v1/auth/me/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: 旧密码与新密码
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: message
      summary: 修改当前用户密码
      tags:
      - 认证
  /api/v1/auth/me/preferences:
    put:
      consumes:
      - application/json
      parameters:
      - description: theme / material / glass_clear，取值清单见 model/user/preferences.go
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 保存当前用户偏好
      tags:
      - 认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: 刷新令牌
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 刷新令牌
      tags:
      - 认证
  /api/v1/backups:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 备份列表
      tags:
      - 备份管理
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 创建备份
      tags:
      - 备份管理
  /api/v1/backups/{id}:
    delete:
      parameters:
      - description: 备份 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 删除备份
      tags:
      - 备份管理
  /api/v1/backups/{id}/download:
    get:
      parameters:
      - description: 备份 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses: {}
      summary: 下载备份
      tags:
      - 备份管理
  /api/v1/backups/{id}/restore:
    post:
      parameters:
      - description: 备份 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 从备份恢复
      tags:
      - 备份管理
  /api/v1/backups/import:
    post:
      consumes:
      - multipart/form-data
      description: 上传备份 zip（须含根下 database.sql），落到备份列表后即可恢复
      parameters:
      - description: 备份包 (.zip)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 导入备份包
      tags:
      - 备份管理
  /api/v1/collections:
    get:
      parameters:
      - description: 收藏类型 1=文档 2=空间
        in: query
        name: type
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 我的收藏
      tags:
      - 收藏
  /api/v1/collections/check:
    get:
      parameters:
      - description: 收藏类型 1=文档 2=空间
        in: query
        name: type
        required: true
        type: integer
      - description: 资源 ID
        in: query
        name: resource_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 检查收藏状态
      tags:
      - 收藏
  /api/v1/collections/toggle:
    post:
      consumes:
      - application/json
      parameters:
      - description: 'type: 1=文档 2=空间'
        in: body
        name: request
        required: true
        schema:
          properties:
            resource_id:
              type: string
            type:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 收藏/取消收藏
      tags:
      - 收藏
  /api/v1/configs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 系统配置列表
      tags:
      - 系统配置
    put:
      consumes:
      - application/json
      parameters:
      - description: 配置键
        in: query
        name: key
        required: true
        type: string
      - description: 配置值
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 更新配置
      tags:
      - 系统配置
  /api/v1/configs/value:
    get:
      parameters:
      - description: 配置键
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: 获取配置值
      tags:
      - 系统配置
  /api/v1/documents:
    post:
      consumes:
      - application/json
      parameters:
      - description: 文档信息
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
      summary: 创建文档
      tags:
      - 文档
  /api/v1/documents/:id:
    delete:
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: message
      summary: 删除文档
      tags:
      - 文档
    get:
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 获取文档详情
      tags:
      - 文档
    put:
      consumes:
      - application/json
      parameters:
      - description: 文档 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 文档信息
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
