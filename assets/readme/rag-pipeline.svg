<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-label="RAG 检索管线：十个阶段，阶段名与标识符取自 retriever.go 实际发出的 RAGRetrievalStep（问题分解 decompose、查询重写 query_rewrite、向量搜索 vector_search、关键词搜索 keyword_search、结果重排 rerank、权限过滤 filter）以及真实函数名 CheckQuerySafety、hybridRetrieveWithHyDE、ValidateAnswer。末端三态引用徽标来自 verifiable.go，不经 LLM 判定。">
  <title>RAG 十个阶段的检索管线图：从安全护栏到引用校验</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="1200" height="520" fill="#f5f5f7"/>

    <text x="46" y="46" font-size="26" font-weight="600" letter-spacing="-0.4" fill="#1d1d1f">RAG 管线：先证伪，再作答</text>
    <text x="46" y="72" font-size="16" fill="#6b6b70">阶段名与标识符取自 <tspan font-family="'SF Mono', Menlo, monospace" fill="#1d1d1f">retriever.go</tspan> 实际发出的 <tspan font-family="'SF Mono', Menlo, monospace" fill="#1d1d1f">RAGRetrievalStep</tspan></text>

    <defs>
      <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0 0l7 4.5L0 9z" fill="#c7c7cc"/>
      </marker>
    </defs>

    <!-- ===== 第一行 ===== -->
    <g>
      <rect x="46" y="96" width="262" height="116" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="72" cy="122" r="13" fill="#ffebeb"/>
      <text x="72" y="127" font-size="14" font-weight="600" fill="#ff3b30" text-anchor="middle">1</text>
      <text x="94" y="127" font-size="19" font-weight="600" fill="#1d1d1f">安全护栏</text>
      <text x="62" y="156" font-size="16" fill="#6e6e73">问题先过安全检查，</text>
      <text x="62" y="178" font-size="16" fill="#6e6e73">拦截即写审计事件</text>
      <text x="292" y="202" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">CheckQuerySafety</text>

      <line x1="308" y1="148" x2="326" y2="148" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

      <rect x="328" y="96" width="262" height="116" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="354" cy="122" r="13" fill="#e6f2ff"/>
      <text x="354" y="127" font-size="14" font-weight="600" fill="#0071e3" text-anchor="middle">2</text>
      <text x="376" y="127" font-size="19" font-weight="600" fill="#1d1d1f">问题分解</text>
      <text x="344" y="156" font-size="16" fill="#6e6e73">复合问题拆成子问题，</text>
      <text x="344" y="178" font-size="16" fill="#6e6e73">分别检索后合并</text>
      <text x="574" y="202" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">decompose</text>

      <line x1="590" y1="148" x2="608" y2="148" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

      <rect x="610" y="96" width="262" height="116" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="636" cy="122" r="13" fill="#e6f2ff"/>
      <text x="636" y="127" font-size="14" font-weight="600" fill="#0071e3" text-anchor="middle">3</text>
      <text x="658" y="127" font-size="19" font-weight="600" fill="#1d1d1f">查询重写</text>
      <text x="626" y="156" font-size="16" fill="#6e6e73">同义扩展 / 消歧 /</text>
      <text x="626" y="178" font-size="16" fill="#6e6e73">缩写展开，提升召回</text>
      <text x="856" y="202" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">query_rewrite</text>

      <line x1="872" y1="148" x2="890" y2="148" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

      <!-- 混合检索：四路召回 -->
      <rect x="892" y="96" width="262" height="116" rx="18" fill="#ffffff" stroke="#0071e3" stroke-opacity="0.3"/>
      <circle cx="918" cy="122" r="13" fill="#e6f2ff"/>
      <text x="918" y="127" font-size="14" font-weight="600" fill="#0071e3" text-anchor="middle">4</text>
      <text x="940" y="127" font-size="19" font-weight="600" fill="#1d1d1f">混合检索</text>
      <rect x="908" y="140" width="110" height="24" rx="8" fill="#f0f0f0"/>
      <text x="963" y="157" font-size="14" fill="#1d1d1f" text-anchor="middle">向量搜索</text>
      <rect x="1026" y="140" width="110" height="24" rx="8" fill="#f0f0f0"/>
      <text x="1081" y="157" font-size="14" fill="#1d1d1f" text-anchor="middle">关键词搜索</text>
      <rect x="908" y="170" width="110" height="24" rx="8" fill="#f0f0f0"/>
      <text x="963" y="187" font-size="14" fill="#1d1d1f" text-anchor="middle">HyDE</text>
      <rect x="1026" y="170" width="110" height="24" rx="8" fill="#f0f0f0"/>
      <text x="1081" y="187" font-size="14" fill="#1d1d1f" text-anchor="middle">GraphRAG</text>
    </g>

    <path d="M1023 212v24H192v22" fill="none" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

    <!-- ===== 第二行 ===== -->
    <g>
      <rect x="46" y="250" width="262" height="116" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="72" cy="276" r="13" fill="#e6f2ff"/>
      <text x="72" y="281" font-size="14" font-weight="600" fill="#0071e3" text-anchor="middle">5</text>
      <text x="94" y="281" font-size="19" font-weight="600" fill="#1d1d1f">RRF 融合</text>
      <text x="62" y="310" font-size="16" fill="#6e6e73">四路结果按名次融合，</text>
      <text x="62" y="332" font-size="16" fill="#6e6e73">k = 60</text>
      <text x="292" y="356" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">shared/rrf</text>

      <line x1="308" y1="302" x2="326" y2="302" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

      <rect x="328" y="250" width="262" height="116" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="354" cy="276" r="13" fill="#e6f2ff"/>
      <text x="354" y="281" font-size="14" font-weight="600" fill="#0071e3" text-anchor="middle">6</text>
      <text x="376" y="281" font-size="19" font-weight="600" fill="#1d1d1f">结果重排</text>
      <text x="344" y="310" font-size="16" fill="#6e6e73">CrossEncoder 精排</text>
      <text x="344" y="332" font-size="16" fill="#6e6e73">+ MMR 去冗余</text>
      <text x="574" y="356" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">rerank</text>

      <line x1="590" y1="302" x2="608" y2="302" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

      <rect x="610" y="250" width="262" height="116" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="636" cy="276" r="13" fill="#fff3e0"/>
      <text x="636" y="281" font-size="14" font-weight="600" fill="#ff9500" text-anchor="middle">7</text>
      <text x="658" y="281" font-size="19" font-weight="600" fill="#1d1d1f">权限过滤</text>
      <text x="626" y="310" font-size="16" fill="#6e6e73">按<tspan fill="#1d1d1f">提问者</tspan>的空间权限</text>
      <text x="626" y="332" font-size="16" fill="#6e6e73">剔除无权可见的来源</text>
      <text x="856" y="356" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">permission_checker</text>

      <line x1="872" y1="302" x2="890" y2="302" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

      <rect x="892" y="250" width="262" height="116" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="918" cy="276" r="13" fill="#e6f2ff"/>
      <text x="918" y="281" font-size="14" font-weight="600" fill="#0071e3" text-anchor="middle">8</text>
      <text x="940" y="281" font-size="19" font-weight="600" fill="#1d1d1f">生成与答案校验</text>
      <text x="908" y="310" font-size="16" fill="#6e6e73">仅用过滤后的上下文</text>
      <text x="908" y="332" font-size="16" fill="#6e6e73">生成，答案再过一次护栏</text>
      <text x="1138" y="356" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">ValidateAnswer</text>
    </g>

    <path d="M1023 366v22H192v22" fill="none" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>

    <!-- ===== 第三行：证伪与溯源 ===== -->
    <g>
      <rect x="46" y="404" width="262" height="94" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="72" cy="430" r="13" fill="#f5e6ff"/>
      <text x="72" y="435" font-size="14" font-weight="600" fill="#af52de" text-anchor="middle">9</text>
      <text x="94" y="435" font-size="19" font-weight="600" fill="#1d1d1f">幻觉检测</text>
      <text x="62" y="462" font-size="16" fill="#6e6e73">事实核查不过 → 带指引重写，</text>
      <text x="62" y="482" font-size="16" fill="#6e6e73">最多 2 次</text>

      <rect x="328" y="404" width="340" height="94" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <circle cx="354" cy="430" r="13" fill="#e6f9ef"/>
      <text x="354" y="435" font-size="14" font-weight="600" fill="#34c759" text-anchor="middle">10</text>
      <text x="376" y="435" font-size="19" font-weight="600" fill="#1d1d1f">引用校验</text>
      <text x="344" y="462" font-size="16" fill="#6e6e73">按 [n] 标记与片段覆盖度判定，不经 LLM</text>
      <rect x="344" y="470" width="76" height="22" rx="6" fill="#e6f9ef"/>
      <text x="382" y="486" font-size="14" font-weight="600" fill="#34c759" text-anchor="middle">已引用</text>
      <rect x="428" y="470" width="76" height="22" rx="6" fill="#fff3e0"/>
      <text x="466" y="486" font-size="14" font-weight="600" fill="#ff9500" text-anchor="middle">未引用</text>
      <rect x="512" y="470" width="76" height="22" rx="6" fill="#ffebeb"/>
      <text x="550" y="486" font-size="14" font-weight="600" fill="#ff3b30" text-anchor="middle">未找到</text>

      <!-- 输出 -->
      <line x1="668" y1="447" x2="686" y2="447" stroke="#c7c7cc" stroke-width="2" marker-end="url(#arw)"/>
      <rect x="688" y="404" width="466" height="94" rx="18" fill="#ffffff" stroke="#f0f0f0"/>
      <text x="712" y="435" font-size="19" font-weight="600" fill="#1d1d1f">带角标的答案 + 参考来源</text>
      <text x="712" y="462" font-size="16" fill="#6e6e73">每条来源可跳转原文；用量 / 时延随流式终帧下发</text>
      <text x="652" y="431" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#0071e3" text-anchor="end">rag/verifiable.go</text>
    </g>
  </g>
</svg>
