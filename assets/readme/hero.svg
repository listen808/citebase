<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Citebase：把文档协作与 AI 问答做在同一套数据之上。右侧为真实前端的答案引用三态徽标（已引用 / 未引用 / 未找到），配色与圆角取自 apple-tokens.ts。">
  <title>Citebase 标题图：把文档协作与 AI 问答做在同一套数据之上，右侧为答案引用三态徽标</title>
  <defs>
    <filter id="card" x="-6%" y="-14%" width="112%" height="132%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="1200" height="340" fill="#f5f5f7"/>

    <!-- 卡片：AppleRadius.card 18px + AppleShadow.card -->
    <rect x="48" y="40" width="1104" height="260" rx="18" fill="#ffffff" filter="url(#card)"/>

    <!-- 左：标题系统 -->
    <text x="88" y="94" font-size="18" font-weight="600" letter-spacing="1.6" fill="#86868b">ENTERPRISE AI KNOWLEDGE PLATFORM</text>
    <text x="88" y="166" font-size="82" font-weight="600" letter-spacing="-2.2" fill="#1d1d1f">Citebase</text>
    <text x="88" y="212" font-size="27" font-weight="400" letter-spacing="-0.4" fill="#1d1d1f">把「文档协作」和「AI 问答」</text>
    <text x="88" y="248" font-size="27" font-weight="400" letter-spacing="-0.4" fill="#1d1d1f">做在<tspan fill="#0071e3">同一套数据</tspan>之上</text>
    <text x="88" y="282" font-size="18" fill="#6b6b70">Go 1.26 · Vue 3.5 · MySQL 8.0 · 全文 / 向量 / 图谱三索引</text>

    <!-- 右：真实答案引用三态徽标（ChatSourcesModal verifyBadgeStyle） -->
    <rect x="700" y="72" width="420" height="196" rx="12" fill="#f5f5f7"/>
    <text x="724" y="102" font-size="18" font-weight="600" fill="#1d1d1f">答案溯源 · 三态校验</text>

    <text x="724" y="136" font-size="20" fill="#1d1d1f">季度营收增长主要来自</text>
    <rect x="928" y="118" width="22" height="22" rx="6" fill="#0071e3"/>
    <text x="939" y="134" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
    <text x="956" y="136" font-size="20" fill="#1d1d1f">企业订阅</text>

    <rect x="724" y="160" width="86" height="26" rx="6" fill="#e6f9ef"/>
    <text x="767" y="178" font-size="17" font-weight="600" fill="#34c759" text-anchor="middle">已引用</text>
    <rect x="820" y="160" width="86" height="26" rx="6" fill="#fff3e0"/>
    <text x="863" y="178" font-size="17" font-weight="600" fill="#ff9500" text-anchor="middle">未引用</text>
    <rect x="916" y="160" width="86" height="26" rx="6" fill="#ffebeb"/>
    <text x="959" y="178" font-size="17" font-weight="600" fill="#ff3b30" text-anchor="middle">未找到</text>

    <text x="724" y="222" font-size="18" fill="#6e6e73">状态由 <tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#1d1d1f">[n]</tspan> 标记与片段覆盖度算出，不经 LLM</text>
    <text x="724" y="250" font-size="18" fill="#6e6e73"><tspan fill="#0071e3">rag/verifiable.go</tspan> · 每条来源可跳原文</text>
  </g>
</svg>
