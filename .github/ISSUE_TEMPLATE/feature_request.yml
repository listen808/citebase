name: 功能建议
description: 提出一个新能力或改进，而不是报告缺陷
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清"要解决谁的什么问题"，再谈方案。只写方案的需求很难评估。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难；现在是怎么绕过去的
      placeholder: 例如：运维在 200 个空间里找一份文档，只能靠 Ctrl+F 翻列表
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 可以只写"我希望它看起来/用起来是什么样"，不必写实现
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 为什么现有能力不够；试过哪些别的做法
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 前端界面 / 主题
        - 后端接口 / 数据模型
        - 搜索 / RAG / AI
        - 部署 / 运维
        - 文档 / 工具链
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      description: 帮助我们判断要不要拆成多期
      options:
        - 单页面小改
        - 跨模块改造
        - 需要数据结构变更
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 issue，没有重复
          required: true
