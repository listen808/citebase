name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go 后端 · gofmt / build / vet / test / 文档链接
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt（必须零输出）
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - run: go build ./...

      - run: go vet ./internal/... ./app/... ./tools/...

      - run: go test ./internal/... ./tools/repocheck/... -count=1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: 文档相对链接
        run: node tools/validate-doc-links.mjs

  web:
    name: 前端 · lint / 类型 / 样式门禁 / vitest / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # prepare 脚本会去装 husky 钩子，CI 里不需要，也会因 .husky 目录缺失而报错
      - run: npm ci --ignore-scripts

      - run: npm run ci

  secrets:
    name: 密钥扫描 · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: gitleaks（只扫已入库内容，不翻历史与本地文件）
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          mkdir -p /tmp/scan && git archive HEAD | tar -x -C /tmp/scan
          args="--no-git --source /tmp/scan --redact --no-banner"
          [ -f .gitleaks.toml ] && args="$args --config .gitleaks.toml"
          ./gitleaks detect $args